<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ACBB TT — Refonte · Équipes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#0B0B0D;color:#F6F5F3;font-family:"Space Grotesk",system-ui,sans-serif}
  a{color:#F26A1B}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 26px}
  .mono{font-family:"JetBrains Mono",monospace}
  .card{background:#141416;border:1px solid rgba(255,255,255,0.08);border-radius:16px}
  .tp{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:800;padding:7px 11px;border-radius:99px;background:#141416;border:1px solid rgba(255,255,255,0.14);color:rgba(246,245,243,0.5);cursor:pointer;text-decoration:none}
  .tp.on{background:#F26A1B;color:#0B0B0D;border-color:#F26A1B}
  table{border-collapse:collapse;width:100%}
  td{padding:7px 10px;font-size:11.5px;border-top:1px solid rgba(255,255,255,0.05)}
</style>
</head><body>
<div id="chrome"></div>
<div class="wrap">
  <div id="sel" style="display:flex;gap:5px;padding:14px 0 4px;flex-wrap:wrap"></div>
  <div id="head" style="padding:10px 2px 4px"></div>
  <div id="poule" class="card" style="margin-top:12px;overflow:hidden"></div>
  <div id="cal" class="card" style="margin-top:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px"></div>
  <div class="mono" style="margin-top:10px;font-size:10px;color:rgba(246,245,243,0.4)">Classement réel et stats d'équipe disponibles après les premières journées (calcul auto depuis les feuilles FFTT). Le calendrier ci-dessus est l'information publique FFTT — jamais nos compositions.</div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('chrome').innerHTML=App.chrome('equipes.html');
var TEAM=new URLSearchParams(location.search).get('team')||'M1';
App.load().then(function(D){
  if(!D.byTeam[TEAM])TEAM=D.teams[0];
  var sel=document.getElementById('sel');
  sel.innerHTML=D.teams.map(function(t){return '<a class="tp'+(t===TEAM?' on':'')+'" href="equipes.html?team='+t+'">'+t+'</a>';}).join('');
  var p=D.byTeam[TEAM], ds=App.divShort(p.division);
  var wins=0,losses=0;
  for(var j=1;j<=7;j++){var r=D.resOf(TEAM,j);if(r){if(r.us>r.them)wins++;else losses++;}}
  document.getElementById('head').innerHTML=
    '<div style="font-family:\'Saira Condensed\',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:30px;line-height:1"><span style="color:hsl('+App.teamHue(TEAM)+',75%,72%)">'+TEAM+'</span> <span style="color:#F26A1B">· '+App.esc(p.division)+(p.poule?' — poule '+p.poule:'')+'.</span></div>'
    +'<div class="mono" style="font-size:10.5px;color:rgba(246,245,243,0.6);margin-top:3px">'+((wins+losses)?('bilan <b style="color:#86EFAC">'+wins+'V</b> – '+losses+'D'):'saison à venir — 1ʳᵉ journée le '+(D.DATES[0]||''))+'</div>';
  // poule (ordre + niveau 25/26 tant que pas de classement réel)
  var rows=(p.teams||[]).map(function(t){
    var hl=t.acbb?' style="background:rgba(242,106,27,0.1)"':'';
    return '<tr'+hl+'><td class="mono" style="font-weight:800;color:'+(t.acbb?'#F26A1B':'rgba(246,245,243,0.5)')+';width:26px">'+t.pos+'</td>'
      +'<td style="font-weight:'+(t.acbb?'700':'400')+'">'+App.esc(t.name)+(t.acbb?' <span class="mono" style="font-size:9px;color:#F26A1B">ACBB</span>':'')+'</td>'
      +'<td class="mono" style="text-align:right;color:rgba(246,245,243,0.6)" title="niveau moyen aligné en 25/26">'+(t.s25?t.s25.avg:'—')+'</td>'
      +'<td class="mono" style="text-align:right;color:rgba(246,245,243,0.4);font-size:10px">'+(t.s25?App.esc(t.s25.div):'nouveau')+'</td></tr>';
  }).join('');
  document.getElementById('poule').innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:12px 14px 6px"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>La poule <span class="mono" style="font-weight:500;text-transform:none;letter-spacing:0;color:rgba(246,245,243,0.45);font-size:10px">· niveau 25/26, en attendant le vrai classement</span></div>'
    +'<table><tbody>'+rows+'</tbody></table>';
  // calendrier
  var cal='';
  for(var j=1;j<=7;j++){
    var o=D.oppOf(TEAM,j), r=D.resOf(TEAM,j);
    if(!o){continue;}
    var lieu=o.exempt?'exempt':(o.dom?'domicile':'extérieur');
    if(r){
      var win=r.us>r.them;
      cal+='<div style="display:flex;align-items:center;gap:9px;background:#1E1E22;border-radius:10px;padding:8px 11px">'
        +'<span class="mono" style="font-size:10px;font-weight:800;color:rgba(246,245,243,0.5);width:20px">J'+j+'</span>'
        +'<span style="width:9px;height:9px;border-radius:50%;background:'+(win?'#3DD68C':'#F26356')+'"></span>'
        +'<div style="flex-grow:1;font-size:12px;font-weight:600">'+(o.dom?'vs ':'@ ')+App.esc(o.name)+' <span style="color:rgba(246,245,243,0.48);font-weight:400">· '+lieu+'</span></div>'
        +'<span class="mono" style="font-size:13px;font-weight:800"><span style="color:'+(win?'#86EFAC':'#FCA5A5')+'">'+r.us+'</span>–'+r.them+'</span></div>';
    } else {
      cal+='<div style="display:flex;align-items:center;gap:9px;border:1px dashed rgba(255,255,255,0.14);border-radius:10px;padding:8px 11px">'
        +'<span class="mono" style="font-size:10px;font-weight:800;color:rgba(246,245,243,0.4);width:20px">J'+j+'</span>'
        +'<div style="flex-grow:1;font-size:12px;font-weight:600;color:rgba(246,245,243,0.65)">'+(o.exempt?'Exempt':((o.dom?'vs ':'@ ')+App.esc(o.name)))+' <span style="color:rgba(246,245,243,0.4);font-weight:400">· '+o.date.slice(0,5)+' · '+lieu+'</span></div>'
        +(o.exempt?'':'<a class="mono" href="scouting.html?team='+TEAM+'&j='+j+'" style="display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;color:#F26A1B;border:1px solid rgba(242,106,27,0.45);border-radius:99px;padding:3px 9px;text-decoration:none">🔎 scouter</a>')
        +'</div>';
    }
  }
  document.getElementById('cal').innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Journée par journée</div>'+cal;
});
</script>
</body></html>
