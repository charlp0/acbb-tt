<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ACBB TT — Refonte · Espace référent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#0B0B0D;color:#F6F5F3;font-family:"Space Grotesk",system-ui,sans-serif}
  a{color:#F26A1B}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px 26px}
  .mono{font-family:"JetBrains Mono",monospace}
  .card{background:#141416;border:1px solid rgba(255,255,255,0.08);border-radius:16px}
  select,textarea,input{background:#1E1E22;border:1px solid rgba(255,255,255,0.16);border-radius:11px;color:#F6F5F3;font-family:inherit;font-size:13px;padding:10px 12px;outline:none;width:100%;box-sizing:border-box}
  textarea{min-height:120px;resize:vertical;line-height:1.55}
  .btn{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;font-size:16px;padding:13px;border-radius:99px;background:#F26A1B;color:#0B0B0D;border:none;cursor:pointer;width:100%}
  .btn:disabled{opacity:0.5}
  label{font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:rgba(246,245,243,0.6);display:block;margin-bottom:5px}
</style>
</head><body>
<div id="chrome"></div>
<div class="wrap">
  <div style="padding:16px 2px 4px">
    <div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#F26A1B"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Espace référent · après-match</div>
    <div style="font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:29px;line-height:1;margin-top:7px">Débrief <span style="color:#F26A1B">de journée.</span></div>
    <div class="mono" style="font-size:10.5px;color:rgba(246,245,243,0.6);margin-top:4px">Ton texte s'affiche sur la page d'accueil, carte de ton équipe. Modifiable : republier remplace.</div>
  </div>

  <div class="card" style="margin-top:12px;padding:14px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:9px">
      <div style="flex:1"><label>Équipe</label><select id="fEq"></select></div>
      <div style="flex:1"><label>Journée</label><select id="fJ"></select></div>
    </div>
    <div><label>Ton prénom</label><input id="fAut" placeholder="pour l'historique (non affiché publiquement)"></div>
    <div><label>Débrief</label><textarea id="fTxt" placeholder="Raconte le match à ton équipe : le scénario, les perfs, l'ambiance…"></textarea></div>
    <div style="display:flex;align-items:center;gap:9px">
      <button type="button" disabled class="mono" style="flex:1;padding:10px;border-radius:99px;background:rgba(96,165,250,0.10);border:1px solid rgba(96,165,250,0.3);color:rgba(96,165,250,0.55);font-size:11px;font-weight:800;cursor:not-allowed" title="Activé à la mise en production">✨ Corriger l'orthographe (bientôt)</button>
      <button type="button" disabled class="mono" style="flex:1;padding:10px;border-radius:99px;background:#1E1E22;border:1px solid rgba(255,255,255,0.14);color:rgba(246,245,243,0.4);font-size:11px;font-weight:800;cursor:not-allowed" title="Photo d'équipe — bientôt">📷 Photo (bientôt)</button>
    </div>
    <button id="pub" class="btn" type="button">Publier le débrief</button>
    <div id="st" class="mono" style="font-size:11px;min-height:14px;text-align:center;color:rgba(246,245,243,0.6)"></div>
  </div>

  <div id="cur" class="card" style="margin-top:12px;padding:13px 14px;display:none">
    <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Débrief actuellement publié</div>
    <div id="curTxt" style="font-size:12.5px;line-height:1.55;color:#D4D3CF"></div>
    <div id="curMeta" class="mono" style="font-size:9.5px;color:rgba(246,245,243,0.4);margin-top:7px"></div>
  </div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('chrome').innerHTML=App.chrome('index.html');
var D=null;
App.load().then(function(d){
  D=d;
  var eq=document.getElementById('fEq'), fj=document.getElementById('fJ');
  eq.innerHTML=d.teams.map(function(t){return '<option>'+t+'</option>';}).join('');
  fj.innerHTML=[1,2,3,4,5,6,7].map(function(j){return '<option value="'+j+'"'+(j===d.cur?' selected':'')+'>J'+j+' · '+(d.DATES[j-1]||'')+'</option>';}).join('');
  try{var m=localStorage.getItem('acbb_ref_team');if(m)eq.value=m;var a=localStorage.getItem('acbb_tag_author');if(a)document.getElementById('fAut').value=a;}catch(e){}
  eq.addEventListener('change',showCur); fj.addEventListener('change',showCur); showCur();
});
function showCur(){
  var t=document.getElementById('fEq').value, j=document.getElementById('fJ').value;
  var d=D.debriefs[t+'|'+j], box=document.getElementById('cur');
  if(d){box.style.display='block';
    document.getElementById('curTxt').textContent='« '+d.texte+' »';
    document.getElementById('curMeta').textContent='publié le '+new Date(d.created_at).toLocaleDateString('fr-FR')+' — republier le remplacera';
  } else box.style.display='none';
}
document.getElementById('pub').addEventListener('click',function(){
  var t=document.getElementById('fEq').value, j=+document.getElementById('fJ').value;
  var aut=document.getElementById('fAut').value.trim(), txt=document.getElementById('fTxt').value.trim();
  var st=document.getElementById('st');
  if(!txt){st.textContent='⚠ écris ton débrief d\'abord';return;}
  if(txt.length>2000){st.textContent='⚠ 2000 caractères max';return;}
  this.disabled=true; st.textContent='publication…';
  try{localStorage.setItem('acbb_ref_team',t);if(aut)localStorage.setItem('acbb_tag_author',aut);}catch(e){}
  fetch(App.SB+'/rest/v1/debriefs_log',{method:'POST',headers:{'apikey':App.KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({equipe:t,journee:j,auteur:aut||'référent',texte:txt})})
  .then(function(r){
    if(!r.ok)throw new Error(r.status===404?'table debriefs_log absente (à créer)':'HTTP '+r.status);
    st.innerHTML='✓ publié — visible sur <a href="index.html">la page d\'accueil</a>';
    D.debriefs[t+'|'+j]={equipe:t,journee:j,texte:txt,created_at:new Date().toISOString()};
    showCur(); document.getElementById('fTxt').value='';
  })
  .catch(function(e){st.textContent='⚠ échec : '+e.message;})
  .finally(function(){document.getElementById('pub').disabled=false;});
});
</script>
</body></html>
