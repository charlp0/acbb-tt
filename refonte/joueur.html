<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ACBB TT — Refonte · Joueurs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#0B0B0D;color:#F6F5F3;font-family:"Space Grotesk",system-ui,sans-serif}
  a{color:#F26A1B}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px 26px}
  .mono{font-family:"JetBrains Mono",monospace}
  .card{background:#141416;border:1px solid rgba(255,255,255,0.08);border-radius:16px}
  .srch{width:100%;background:transparent;border:none;outline:none;color:#F6F5F3;font-family:inherit;font-size:13px}
  .hit{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;cursor:pointer}
  .hit:hover{background:#1E1E22}
</style>
</head><body>
<div id="chrome"></div>
<div class="wrap">
  <div class="card" style="border-radius:99px;padding:11px 17px;display:flex;align-items:center;gap:9px;margin-top:14px;border-color:rgba(242,106,27,0.45)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F26A1B" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" class="srch" placeholder="Cherche un joueur — nom, prénom ou combinaison…" autocomplete="off">
  </div>
  <div id="hits" class="card" style="display:none;margin-top:6px;padding:6px;max-height:320px;overflow:auto"></div>
  <div id="fiche" style="margin-top:14px"></div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('chrome').innerHTML=App.chrome('joueur.html');
App.load().then(function(D){
  var q=document.getElementById('q'), hits=document.getElementById('hits');
  q.addEventListener('input',function(){
    var v=App.nrm(q.value);
    if(v.length<2){hits.style.display='none';return;}
    var out=D.scoring.filter(function(p){
      var a=App.nrm(p.nom+' '+p.pre), b=App.nrm(p.pre+' '+p.nom);
      return a.indexOf(v)>=0||b.indexOf(v)>=0;
    }).slice(0,12);
    hits.innerHTML=out.map(function(p){
      return '<div class="hit" data-i="'+D.scoring.indexOf(p)+'"><b style="font-size:13px">'+App.esc(p.pre+' '+p.nom)+'</b><span style="flex-grow:1"></span><span class="mono" style="font-size:11px;color:rgba(246,245,243,0.5)">'+(p.men||'')+'</span></div>';
    }).join('')||'<div style="padding:9px;font-size:12px;color:rgba(246,245,243,0.4)">aucun joueur</div>';
    hits.style.display='block';
    hits.querySelectorAll('.hit').forEach(function(h){h.addEventListener('click',function(){show(D,D.scoring[+h.dataset.i]);hits.style.display='none';q.value='';});});
  });
  // deep-link ?lic=
  var lic=new URLSearchParams(location.search).get('lic');
  if(lic){
    var p=D.scoring.find(function(x){return String(x.lic)===lic||((App.nrm(x.nom)+'|'+App.nrm(x.pre))===lic);});
    if(p)show(D,p);
  }
  if(!lic)document.getElementById('fiche').innerHTML='<div class="card" style="padding:16px;font-size:12.5px;color:rgba(246,245,243,0.55)">Cherche un joueur ci-dessus : classement 26/27, progression, catégorie, historique — et l\'accès à sa fiche archivée 25/26.</div>';
});
function show(D,p){
  var cat=D.cats[String(p.lic)]||D.cats[App.nrm(p.nom)+'|'+App.nrm(p.pre)]||'';
  var jeune=cat&&cat!=='S';
  var ini=(p.pre?p.pre[0]:'')+(p.nom?p.nom[0]:'');
  var h=(p.h||[]).concat([{l:'26/27',pt:p.men}]);
  // chart
  var W=440,H=90,pad=12;
  var pts=h.map(function(x){return x.pt;}).filter(function(x){return x!=null;});
  var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts); if(mx===mn)mx=mn+1;
  var svg='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  var coords=h.map(function(x,i){var X=pad+i*(W-2*pad)/Math.max(1,h.length-1);var Y=H-16-(x.pt-mn)*(H-34)/(mx-mn);return [X,Y];});
  svg+='<path d="M'+coords.map(function(c){return c[0]+' '+c[1];}).join(' L')+'" fill="none" stroke="#F26A1B" stroke-width="2.5" stroke-linecap="round"></path>';
  coords.forEach(function(c,i){svg+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(i===coords.length-1?4.5:3)+'" fill="'+(i===coords.length-1?'#F26A1B':'#0B0B0D')+'" stroke="#F26A1B" stroke-width="2"></circle>';});
  svg+='</svg>';
  var labels='<div class="mono" style="display:flex;justify-content:space-between;font-size:8.5px;color:rgba(246,245,243,0.45)">'+h.map(function(x){return '<span>'+App.esc(x.l)+'</span>';}).join('')+'</div>';
  var eq2=p.eq2?('<div class="mono" style="font-size:11px;color:#D4D3CF">Ch. équipe M · phase 2 25/26 : <b style="color:'+(p.eq2.pct>=50?'#86EFAC':'#FCA5A5')+'">'+p.eq2.pct+'%</b> · '+p.eq2.n+' matchs</div>'):'';
  var arch=p.lic?('<a href="../joueur.html?lic='+p.lic+'" style="text-decoration:none"><div class="card" style="margin-top:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:#D4D3CF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(246,245,243,0.5)" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 7l2-3h14l2 3"></path><path d="M10 12h4"></path></svg><div><div style="font-size:12px;font-weight:600">Saison 2025/26 · fiche archivée</div><div style="font-size:10px;color:rgba(246,245,243,0.48)">timeline, perfs, toutes compétitions</div></div><span style="flex-grow:1"></span><span class="mono" style="font-size:12px;color:rgba(246,245,243,0.5)">→</span></div></a>'):'';
  document.getElementById('fiche').innerHTML=
    '<div style="display:flex;align-items:center;gap:12px">'
    +'<div style="width:50px;height:50px;border-radius:15px;background:linear-gradient(140deg,rgba(242,106,27,0.35),#1E1E22);display:flex;align-items:center;justify-content:center;font-family:\'Saira Condensed\',sans-serif;font-style:italic;font-weight:800;font-size:18px;color:#F26A1B">'+App.esc(ini)+'</div>'
    +'<div><div style="font-family:\'Saira Condensed\',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:25px;line-height:1">'+App.esc(p.pre)+' <span style="color:#F26A1B">'+App.esc(p.nom)+'</span></div>'
    +'<div class="mono" style="font-size:10.5px;color:rgba(246,245,243,0.6);margin-top:3px">'
    +(cat?'<span style="font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba('+(jeune?'96,165,250':'255,255,255')+','+(jeune?'0.16':'0.06')+');border:1px solid rgba('+(jeune?'96,165,250':'255,255,255')+',0.4);color:'+(jeune?'#60A5FA':'rgba(246,245,243,0.6)')+'">'+cat+'</span> ':'')
    +(p.lic?('lic. '+p.lic+' · '):'')+'ACBB</div></div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px">'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:19px;font-weight:800">'+(p.men||'—')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:2px">mensuel 26/27</div></div>'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:19px;font-weight:800;color:'+(p.tend>0?'#86EFAC':(p.tend<0?'#FCA5A5':'#D4D3CF'))+'">'+(p.tend!=null?((p.tend>0?'+':'')+p.tend):'—')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:2px">tendance 4 phases</div></div>'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:19px;font-weight:800;color:'+(p.spp>0?'#86EFAC':'#D4D3CF')+'">'+(p.spp!=null?((p.spp>0?'+':'')+p.spp):'—')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:2px">pente / phase</div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:12px;padding:13px 14px"><div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Trajectoire</div>'+svg+labels+'</div>'
    +(eq2?'<div class="card" style="margin-top:12px;padding:11px 14px">'+eq2+'</div>':'')
    +'<div class="card" style="margin-top:12px;padding:11px 14px"><div class="mono" style="font-size:11px;color:rgba(246,245,243,0.55)">📊 Parties &amp; V/D 26/27 : disponibles automatiquement après les premières journées (feuilles FFTT).</div></div>'
    +arch;
}
</script>
</body></html>
