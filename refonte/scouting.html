<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ACBB TT — Refonte · Scouting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
  body{margin:0;background:#0B0B0D;color:#F6F5F3;font-family:"Space Grotesk",system-ui,sans-serif}
  a{color:#F26A1B}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px 26px}
  .mono{font-family:"JetBrains Mono",monospace}
  .card{background:#141416;border:1px solid rgba(255,255,255,0.08);border-radius:16px}
</style>
</head><body>
<div id="chrome"></div>
<div class="wrap"><div id="body" style="padding-top:12px"><div class="mono" style="color:rgba(246,245,243,0.5)">chargement…</div></div></div>
<script src="app.js"></script>
<script>
document.getElementById('chrome').innerHTML=App.chrome('equipes.html');
var q=new URLSearchParams(location.search);
var TEAM=q.get('team')||'M8', J=parseInt(q.get('j')||'1',10);
App.load().then(function(D){
  if(!D.byTeam[TEAM])TEAM=D.teams[0];
  var o=D.oppOf(TEAM,J);
  var b=document.getElementById('body');
  if(!o||o.exempt){b.innerHTML='<div class="card" style="padding:16px">Pas de rencontre pour '+TEAM+' en J'+J+'.</div>';return;}
  var played=D.teams.some(function(t){return D.resOf(t,1);});
  b.innerHTML=
    '<div style="display:flex;align-items:center;gap:8px"><a class="mono" href="equipes.html?team='+TEAM+'" style="font-size:11px;text-decoration:none">← '+TEAM+'</a><span style="flex-grow:1"></span><span class="mono" style="font-size:9.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(242,106,27,0.13);border:1px solid rgba(242,106,27,0.45);color:#F26A1B">'+TEAM+' · J'+J+'</span></div>'
    +'<div style="padding:12px 2px 4px"><div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#F26A1B"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Adversaire de la J'+J+'</div>'
    +'<div style="font-family:\'Saira Condensed\',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:27px;line-height:1.02;margin-top:7px">'+App.esc(o.name)+'<span style="color:#F26A1B">.</span></div>'
    +'<div class="mono" style="font-size:10.5px;color:rgba(246,245,243,0.6);margin-top:4px">'+App.esc(o.division)+(o.poule?' · poule '+o.poule:'')+' · '+o.date.slice(0,5)+' · <b style="color:'+(o.dom?'#86EFAC':'#FCA5A5')+'">'+(o.dom?'à domicile':'déplacement')+'</b></div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px">'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:18px;font-weight:800;color:#FCA5A5">'+(o.s25?o.s25.avg:'—')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:2px">niveau aligné 25/26</div></div>'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:18px;font-weight:800">'+(o.s25?o.s25.rank+'ᵉ':'—')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:2px">rang 25/26</div></div>'
    +'<div class="card" style="padding:10px 8px;text-align:center"><div class="mono" style="font-size:12px;font-weight:700;color:#D4D3CF;padding-top:4px">'+(o.s25?App.esc(o.s25.div):'nouveau')+'</div><div style="font-size:8.5px;color:rgba(246,245,243,0.48);text-transform:uppercase;margin-top:4px">division 25/26</div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:12px;padding:13px 14px"><div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Joueurs probables</div>'
    +'<div class="mono" style="font-size:11px;color:rgba(246,245,243,0.55);margin-top:8px">'+(played?'Analyse des feuilles en cours — disponible sous peu.':'Disponible après leurs premières feuilles de match (J1, '+(D.DATES[0]||'')+') : joueurs alignés, classements, formes.')+'</div></div>'
    +'<div class="card" style="margin-top:12px;padding:13px 14px"><div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase"><span style="width:5px;height:5px;border-radius:50%;background:#F26A1B"></span>Pronostic</div>'
    +'<div class="mono" style="font-size:11px;color:rgba(246,245,243,0.55);margin-top:8px">Calculé après J1 à partir des moyennes réellement alignées (sources feuilles FFTT publiques) — aucune composition à venir n\'est utilisée ni affichée.</div></div>';
});
</script>
</body></html>
