name: Mise à jour données FFTT

on:
  schedule:                    # tous les jours, 4 créneaux (réactivé le 16/09/2026, décision Charles)
    - cron: '0 6 * * *'        # ~8h Paris
    - cron: '0 11 * * *'       # ~13h Paris
    - cron: '0 17 * * *'       # ~19h Paris
    - cron: '0 21 * * *'       # ~23h Paris
  workflow_dispatch:           # déclenchement manuel (bouton "Run workflow" / gh workflow run)
    inputs:
      full:
        description: 'Rebuild complet (1 = tout reconstruire, ignore le cache)'
        default: '0'
      dry_run:
        description: 'Validation isolée sans publication ni alerte (1 = oui)'
        default: '0'
      sample:
        description: 'En validation uniquement : trois profils représentatifs (1 = oui)'
        default: '0'
      only_site:
        description: 'Ne régénérer que site.json (poules/classements), sans les profils joueurs (1 = oui)'
        default: '0'

permissions:
  contents: write
  issues: write

concurrency:
  group: fftt-data
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Restaurer le cache incrémental (état + adversaires)
        uses: actions/cache@v4
        with:
          path: |
            data/_state.json
            data/_oppcache.json
          key: fftt-cache-v2-${{ github.run_id }}    # toujours unique -> sauvegarde à chaque run
          restore-keys: |
            fftt-cache-v2-                            # restaure le cache le plus récent
      - name: Génération des profils joueurs
        if: ${{ github.event.inputs.only_site != '1' }}
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          FFTT_TOP: '0'          # 0 = tout le club ayant joué ≥1 match cette saison
          FFTT_FULL: ${{ github.event.inputs.full || '0' }}   # 1 = rebuild complet (manuel)
          FFTT_SKIP_IF_FRESH: '0'   # chaque créneau tourne en incrémental (seuls les joueurs avec de nouveaux matchs sont recalculés)
          FFTT_SAMPLE: ${{ github.event.inputs.dry_run == '1' && github.event.inputs.sample == '1' && '1' || '0' }}
        run: python3 scripts/collect_profiles.py
      - name: Génération data-driven des pages d'équipe (site.json)
        if: ${{ github.event.inputs.only_site == '1' || github.event.inputs.dry_run == '1' }}
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          FFTT_SKIP_IF_FRESH: '0'
        run: python3 scripts/fftt_site.py
      - name: Génération du scoring compo (scoring.json — progression 4 phases)
        if: ${{ github.event.inputs.only_site != '1' }}
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          FFTT_SKIP_IF_FRESH: '0'
        run: python3 scripts/fftt_scoring.py
      - name: Licences valides alignées sur l'effectif FFTT (ajouts seulement)
        continue-on-error: true   # un échec ici ne doit pas bloquer la publication des données
        env:
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python3 scripts/sync_licences_valides.py
      - name: Vérifier les sorties et dater chaque source
        run: python3 scripts/check_data.py
      - name: Commit si changement
        if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != '1'
        run: |
          git config user.name "acbb-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/players/ data/players_index.json data/meta.json data/teams.json data/site.json data/site.js data/scoring.json data/scoring.js
          if git diff --staged --quiet; then
            echo "Aucun changement dans les données."
          else
            git commit -m "data: mise à jour auto $(date -u +%Y-%m-%d)"
            # Un conflit est visible ; aucune priorité automatique au robot.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Alerte si échec (issue GitHub)
        if: failure() && github.event.inputs.dry_run != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # une seule issue ouverte à la fois (même motif que results.yml) : pas une par échec
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'Échec mise à jour données FFTT in:title' --json number -q length)
          [ "$N" != 0 ] && { echo "issue déjà ouverte"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🤖 Échec mise à jour données FFTT — $(date -u +%d/%m/%Y)" \
            --body "Le run a échoué : https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}

          Consulter l’étape en échec. Les données ne sont publiées qu’après validation du lot. Relancer manuellement : onglet Actions → Run workflow." || true
