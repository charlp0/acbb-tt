name: Brûlage des adversaires (FFTT)
# Séparé de « Résultats équipes FFTT » : quand l'API FFTT est lente, ce calcul ne doit jamais
# retarder ni faire échouer la publication des résultats. Il relit data/site.json (n° de club).
on:
  schedule:
    - cron: '40 6,12,22 * * *'   # après les résultats de 06:05, 11:05 et 21:05 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fftt-brulages
  cancel-in-progress: false
jobs:
  brulages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Feuilles des équipes plus fortes des clubs adverses
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/fftt_brulages.py
      - name: Publier
        run: |
          git config user.name acbb-data-bot
          git config user.email bot@users.noreply.github.com
          git add data/brulages2627.json
          if git diff --staged --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "data: brûlage des adversaires"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
