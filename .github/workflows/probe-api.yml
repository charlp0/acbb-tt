name: Sonde API FFTT (one-shot)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de sonde à exécuter (dossier scripts/probes/, lancé depuis la racine du dépôt)"
        required: false
        default: "scripts/probes/probe_partie.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Exécuter la sonde
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python3 "${{ github.event.inputs.script || 'scripts/probes/probe_partie.py' }}"
