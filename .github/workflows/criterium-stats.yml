name: Bilans critérium (FFTT)
on:
  workflow_dispatch:
    inputs:
      tour:
        description: "Tour du critérium"
        required: false
        default: "1"
permissions:
  contents: write
concurrency:
  group: fftt-data
  cancel-in-progress: false
jobs:
  bilans:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Agrégation
        env:
          PYTHONUNBUFFERED: "1"
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python3 scripts/criterium_stats.py "${{ github.event.inputs.tour || '1' }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/criterium2627.json
          git diff --staged --quiet || git commit -m "data: bilans V/D du critérium"
          git push
