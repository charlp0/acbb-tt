name: Alerte dispos privée
on:
  schedule:
    - cron: '0 5-20 * * *'
  repository_dispatch:
    types: [dispos]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dispos-alert
  cancel-in-progress: false
jobs:
  alert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Détecter et conserver les changements en privé
        id: changes
        env:
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: |
          python3 scripts/restore_alert_cursor.py
          python3 scripts/dispos_alert.py --out alert.md > run.log
          cat run.log
          N=$(sed -n 's/^CHANGES=//p' run.log | tail -1)
          echo "count=${N:-0}" >> "$GITHUB_OUTPUT"
          python3 scripts/publish_private_alert.py
      - name: Notification générique sans données de joueurs
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notification.md <<'NOTICE'
          Une mise à jour est à consulter dans [Suivi des disponibilités](https://team.acbb-tt.fr/sportive/suivi-dispos.html).

          Le détail est réservé à la commission sportive, après ouverture de son lien personnel.
          @charlp0
          NOTICE
          gh issue create -R "$GITHUB_REPOSITORY" --title "ACBB — nouvelle notification privée" --body-file notification.md
      - name: Confirmer le curseur privé après notification
        env:
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python3 scripts/publish_private_alert.py --commit-cursor
      # Seul l'avis générique est public ; aucun nom, disponibilité ou composition.
