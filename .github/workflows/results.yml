name: Résultats équipes FFTT
on:
  # Démarre à la fin de « Mise à jour données FFTT » (update-data.yml) au lieu d'un cron à :05 :
  # les deux collectes tournaient en même temps (update-data dure 15-20 min), poussaient toutes
  # deux sur main et déclenchaient chacune une publication. La publication reste assurée par
  # pages.yml, qui écoute la fin de ce workflow (un run lancé par workflow_run déclenche bien
  # les workflow_run suivants, alors qu'un push avec GITHUB_TOKEN ne déclenche aucun push).
  workflow_run:
    workflows: ['Mise à jour données FFTT']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fftt-results
  cancel-in-progress: false
jobs:
  results:
    # Quel que soit le résultat de la mise à jour des données : les feuilles et classements
    # ne dépendent pas des profils joueurs (c'est la raison d'être de ce workflow séparé).
    if: (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Collecter les feuilles et classements sans attendre les profils
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
          FFTT_SKIP_IF_FRESH: '0'
        run: python3 scripts/fftt_site.py
      - run: python3 scripts/check_data.py
      - name: Conserver le dernier lot complet
        run: |
          git config user.name acbb-data-bot
          git config user.email bot@users.noreply.github.com
          git add data/site.json data/site.js
          if ! git diff --staged --quiet; then
            git commit -m "data: résultats équipes FFTT"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Signaler un échec sans données personnelles
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notice.md <<'NOTICE'
          Le dernier lot complet reste en ligne. Consulter le traitement Résultats équipes FFTT dans Actions et les dates affichées dans l'espace sportive.
          NOTICE
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'Résultats équipes FFTT à vérifier in:title' --json number -q length)
          if [ "$N" = 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "Résultats équipes FFTT à vérifier" --body-file notice.md
          fi
