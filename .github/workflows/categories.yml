name: Catégories d'âge FFTT
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fftt-data
  cancel-in-progress: false
jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Collecte des catégories
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
        run: python3 scripts/fftt_categories.py
      - name: Commit
        run: |
          git config user.name "acbb-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/categories.json
          git diff --staged --quiet && echo "rien" || (git commit -m "data: catégories d'âge FFTT" && git pull --rebase origin main && git push)
