name: Salles des adversaires (FFTT)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  salles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Collecte
        env:
          FFTT_ID: ${{ secrets.FFTT_ID }}
          FFTT_PWD: ${{ secrets.FFTT_PWD }}
        run: python3 scripts/fftt_salles_adverses.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/salles_adverses.json
          git diff --staged --quiet || git commit -m "data: salles des adversaires (departemental + regional)"
          git push
