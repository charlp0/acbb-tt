name: Sauvegarde Supabase privée
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Sauvegarder et vérifier dans le stockage privé
        env:
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
        run: python3 scripts/backup_private.py
