name: Vérifications du site
# Sur main, c'est pages.yml (« Publier le site vérifié ») qui exécute cette même suite avant de déployer.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_data.py
      - run: python3 scripts/build_public.py
      - run: python3 scripts/check_public.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
