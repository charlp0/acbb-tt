<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ACBB TT — Équipes 2026/27</title>
<meta name="theme-color" content="#0B0B0D">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
  .tpills{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
  .tpills .pill{min-height:36px;min-width:44px;justify-content:center}
  .tpills .pill.f{color:var(--lose-lt);border-color:rgba(242,99,86,.45)} .tpills .pill.f.on{background:var(--lose);border-color:var(--lose);color:#0B0B0D}
  .grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;margin-top:18px}
  .card .ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .card .ch .t{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:800}
  .rows{display:flex;flex-direction:column;gap:6px}
  .crow{display:grid;grid-template-columns:30px 78px 58px minmax(0,1fr) 68px;align-items:center;gap:10px;padding:10px 12px}
  .crow .j{font-family:"JetBrains Mono",monospace;font-weight:800}
  .crow .opp{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .sc{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
  .sc.win{color:var(--win)} .sc.lose{color:var(--lose)} .sc.draw{color:var(--warn)}
  .crow .wait{text-align:right;color:var(--dimmer)}
  .crow.past{opacity:.85}
  .tag.dom{color:var(--warn);border-color:rgba(250,204,21,.5)}
  .tag.c{text-align:center;justify-content:center;display:inline-flex}
  table.st{width:100%;border-collapse:collapse;font-size:12.5px}
  .st th{font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dimmer);text-align:right;padding:4px 6px;white-space:nowrap}
  .st th.l,.st td.l{text-align:left}
  .st td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-family:"JetBrains Mono",monospace;font-size:12px}
  .st td.l{font-family:"Space Grotesk",system-ui,sans-serif;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%}
  .st td.pos{color:var(--dim)}
  .st tr.me td{background:rgba(242,106,27,.10)} .st tr.me td.l{color:var(--orange);font-weight:700}
  .st td.pts{font-weight:800}
  .empty{font-size:12.5px;color:var(--dim);line-height:1.45}
  .plist{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .plist .card2{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px}
  .plist .card2 .n{font-family:"JetBrains Mono",monospace;color:var(--dim);width:22px}
  .plist .card2.me{border-color:rgba(242,106,27,.5);color:var(--orange);font-weight:700}
  .note{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--warn);background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.35);border-radius:9px;padding:8px 12px;margin-top:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  @media(max-width:480px){
    .crow{grid-template-columns:26px 66px 50px minmax(0,1fr);grid-template-areas:"j d t s" "o o o o";gap:4px 6px;padding:10px 10px}
    .crow .j{grid-area:j}.crow .dt{grid-area:d}.crow .tag,.crow .ph{grid-area:t}.crow .opp{grid-area:o}.crow .sc,.crow .wait{grid-area:s}
    .tag.c{padding:2px 5px;font-size:9px}.st .hide-sm{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="hdr" class="hdr"></div>

  <section class="hero">
    <div>
      <h1 class="h1" id="hTitle">Équipes <em>2026/27</em></h1>
      <div class="hsub" id="hSub">Calendrier et classement de la poule · Phase 1</div>
    </div>
    <span class="lab" id="hRight">calendrier FFTT</span>
  </section>

  <nav class="tpills" id="tpills" aria-label="Choix de l'équipe"></nav>
  <div class="note" id="apiNote" hidden></div>

  <section class="grid2">
    <div class="card">
      <div class="ch"><span class="t">Calendrier</span><span class="lab" id="calSub">7 journées · Phase 1</span></div>
      <div class="rows" id="cal"><div class="empty">Chargement…</div></div>
    </div>
    <div class="card">
      <div class="ch"><span class="t">Classement de la poule</span><span class="lab" id="stSub"></span></div>
      <div id="standings"><div class="empty">Chargement…</div></div>
    </div>
  </section>

  <div class="foot">ACBB Tennis de Table · calendrier, poules et classements FFTT</div>
</div>

<script src="shared/api.js"></script>
<script src="shared/report.js" defer></script>
<script src="shared/track.js?v=1" defer></script>
<script src="shared/nav.js" data-base="."></script>
<script>
(function(){
  'use strict';
  const esc=ACBB.esc;
  const TEAMS=['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12','M13','M14','M15','M16','M17','F1','F2','F3'];
  const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  const ACR=new Set(['ASML','ASPN','SCTT','USMT','ESTT','CSTT','ACBB','ASPTT','ASMB','AVTT','TTMC','PPCM','SLTT','ASTT','ESCP','ASGB']);
  const PART={LE:'Le',LA:'La',LES:'Les',DE:'de',DU:'du',DES:'des',ST:'St',STE:'Ste',SUR:'sur',EN:'en',ET:'et'};
  function capWord(w){ const u=w.toUpperCase(); if(/^\d+$/.test(w)||!w) return w; if(PART[u]) return PART[u]; if(u.length<=3||ACR.has(u)||!/[AEIOUY]/.test(u)) return u; return u[0]+u.slice(1).toLowerCase(); }
  function shortName(n){ return String(n||'').trim().split(/\s+/).map(w=>w.split('-').map(capWord).join('-')).join(' '); }
  function divShort(d){ d=String(d||''); if(/^Pro/i.test(d)) return d.replace(/\s+(Messieurs|Dames)\b/i,'').trim(); return d.replace(/Pré-?Régionale/i,'PR').replace(/Nationale\s*/i,'N').replace(/Régionale\s*/i,'R').replace(/\s*\(\d+\)/,'').replace(/\s+(Messieurs|Dames)\b/i,'').trim(); }
  function divLabel(p){ return divShort(p.division)+(p.poule?' poule '+p.poule:''); }
  function parseFR(d){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d||''); return m?new Date(+m[3],+m[2]-1,+m[1]):null; }
  function fmtDate(d){ const dt=parseFR(d); if(!dt) return d||'à fixer'; return JOURS[dt.getDay()]+' '+d.slice(0,5); }
  function scoreClass(a,b){ return a>b?'win':(a<b?'lose':'draw'); }
  function normName(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
  function sameTeam(a,b){ a=normName(a); b=normName(b); if(!a||!b) return false; if(a===b) return true; const na=a.match(/(\d+)$/),nb=b.match(/(\d+)$/); const fa=a.split(' ')[0],fb=b.split(' ')[0]; return !!(na&&nb&&na[1]===nb[1]&&fa===fb&&fa.length>=4); }
  function standingsFor(site,poule){ const st=site&&site.STANDINGS&&site.STANDINGS[poule.acbb]; if(!Array.isArray(st)||!st.length||!poule.teams) return null; const _joue=st.some(r=>(+r.mp||0)>0||(+r.pts||0)>0); if(!_joue) return null; /* avant la J1 : positions masquées, tout s'affiche dès que la FFTT remonte les premiers résultats */ let hits=0; poule.teams.forEach(t=>{ if(st.some(r=>sameTeam(r.name,t.name))) hits++; }); return hits>=Math.max(4,Math.ceil(poule.teams.length*0.6))?st:null; }

  const S={team:null,poules:null,byTeam:{},scores:{},resultats:{},site:null,apiFail:false};
  const params=new URLSearchParams(location.search);
  S.team=TEAMS.includes(params.get('t'))?params.get('t'):'M1';

  renderNav({active:'Équipes'});
  ACBB.api('me').then(me=>{ renderNav({active:'Équipes',role:me&&me.role,team:me&&me.equipe,name:me&&me.nom}); }).catch(()=>{});

  function pills(){
    document.getElementById('tpills').innerHTML=TEAMS.map(t=>'<a class="pill'+(t[0]==='F'?' f':'')+(t===S.team?' on':'')+'" href="equipe.html?t='+t+'" data-t="'+t+'">'+t+'</a>').join('');
    document.querySelectorAll('#tpills .pill').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); S.team=a.dataset.t; history.replaceState(null,'','equipe.html?t='+S.team); pills(); render(); }));
  }
  pills();

  const pPoules=ACBB.json('data/poules2627.json').then(p=>{ S.poules=p; (p.poules||[]).forEach(x=>{ S.byTeam[x.acbb]=x; }); });
  const pSite=ACBB.json('data/site.json').then(s=>{ S.site=s; }).catch(()=>{});
  const pRes=ACBB.json('data/resultats2627.json').then(r=>{ if(r&&r.resultats) S.resultats=r.resultats; }).catch(()=>{});
  const pApi=Promise.allSettled([1,2,3,4,5,6,7].map(j=>ACBB.api('public/journee?j='+j).then(r=>{ const m={}; ((r&&r.items)||[]).forEach(it=>{ m[it.equipe]=it; }); S.scores[j]=m; })));

  pPoules.then(()=>{ render(); pSite.then(render); pRes.then(render); pApi.then(rs=>{ if(rs.some(r=>r.status==='rejected')){ S.apiFail=true; const n=document.getElementById('apiNote'); n.hidden=false; n.textContent='Scores momentanément indisponibles (serveur). Le calendrier reste à jour.'; } render(); }); })
    .catch(()=>{ document.getElementById('cal').innerHTML='<div class="empty">Calendrier indisponible pour le moment.</div>'; document.getElementById('standings').innerHTML=''; });

  function scoreOf(t,j){ const it=S.scores[j]&&S.scores[j][t]; if(it&&it.score_acbb!=null&&it.score_adv!=null) return [+it.score_acbb,+it.score_adv]; const rr=(S.resultats[t]||[]).find(x=>x.j===j); if(rr&&rr.score_acbb!=null&&rr.score_adv!=null) return [+rr.score_acbb,+rr.score_adv]; return null; }

  function render(){
    const p=S.byTeam[S.team]; if(!p) return;
    const acbbTeam=(p.teams||[]).find(t=>t.acbb);
    document.getElementById('hTitle').innerHTML=esc(S.team)+' <em>· '+esc(divLabel(p))+'</em>';
    document.getElementById('hSub').textContent=(p.division||'')+(acbbTeam?' · '+shortName(acbbTeam.name):'')+' · '+(p.teams||[]).length+' équipes';
    const today=new Date(); today.setHours(0,0,0,0);
    const cal=(p.cal||[]);
    document.getElementById('calSub').textContent=cal.length+' journée'+(cal.length>1?'s':'')+(S.team==='M1'?' · dates FFTT Pro B':' · Phase 1');
    document.getElementById('cal').innerHTML=cal.map(c=>{
      let name=c.oppName||null; if(!name&&c.opp!=null){ const t=(p.teams||[]).find(x=>x.pos===c.opp); name=t?t.name:null; }
      const dt=parseFR(c.date); const past=dt&&dt<today;
      const sc=scoreOf(S.team,c.j);
      let right;
      if(c.exempt) right='<span class="lab wait">exempte</span>';
      else if(sc) right='<span class="sc '+scoreClass(sc[0],sc[1])+'">'+sc[0]+' – '+sc[1]+'</span>';
      else right='<span class="lab wait">'+(past?'en attente':'à venir')+'</span>';
      return '<div class="card2 crow'+(past?' past':'')+'"><span class="j">J'+c.j+'</span><span class="lab dt">'+esc(fmtDate(c.date))+'</span>'+(c.exempt?'<span class="ph"></span>':'<span class="tag c'+(c.dom?' dom':'')+'">'+(c.dom?'Dom.':'Ext.')+'</span>')+'<span class="opp" title="'+esc(name||'')+'">'+(c.exempt?'Exempte':esc(shortName(name)||'adversaire à confirmer'))+'</span>'+right+'</div>';
    }).join('')||'<div class="empty">Calendrier non publié.</div>';

    const st=standingsFor(S.site,p);
    const stEl=document.getElementById('standings'), stSub=document.getElementById('stSub');
    if(st){
      stSub.textContent='après '+Math.max.apply(0,st.map(r=>+r.mp||0))+' journée'+(Math.max.apply(0,st.map(r=>+r.mp||0))>1?'s':'');
      stEl.innerHTML='<div style="overflow-x:auto"><table class="st"><thead><tr><th></th><th class="l">Équipe</th><th>Pts</th><th>J</th><th class="hide-sm">V</th><th class="hide-sm">N</th><th class="hide-sm">D</th><th>+/-</th></tr></thead><tbody>'+
        st.map(r=>{ const me=acbbTeam&&sameTeam(r.name,acbbTeam.name); const diff=(r.diff!=null?r.diff:((+r.gf||0)-(+r.ga||0))); return '<tr'+(me?' class="me"':'')+'><td class="pos">'+esc(r.pos)+'</td><td class="l" title="'+esc(r.name)+'">'+esc(shortName(r.name))+'</td><td class="pts">'+esc(r.pts)+'</td><td>'+esc(r.mp)+'</td><td class="hide-sm">'+esc(r.V)+'</td><td class="hide-sm">'+esc(r.N)+'</td><td class="hide-sm">'+esc(r.D)+'</td><td>'+(diff>0?'+':'')+diff+'</td></tr>'; }).join('')+
        '</tbody></table></div>';
    } else {
      stSub.textContent=(p.teams||[]).length+' équipes';
      stEl.innerHTML='<div class="empty">Classement disponible après la J1, dès publication par la FFTT.</div>'+
        '<div class="lab" style="margin-top:14px">Équipes de la poule · ordre FFTT</div><div class="plist">'+(p.teams||[]).map(t=>'<div class="card2'+(t.acbb?' me':'')+'"><span class="n">'+t.pos+'</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+esc(t.name)+'">'+esc(shortName(t.name))+'</span>'+(t.s25&&t.s25.mvt?'<span class="tag" style="margin-left:auto">'+esc(t.s25.mvt)+'</span>':'')+'</div>').join('')+'</div>';
    }
  }
})();
</script>
</body>
</html>
